<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Resource hints for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- OpenDyslexic font for accessibility -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/opendyslexic@3.0.1/opendyslexic-regular.min.css"
    />

    <!-- Ubuntu font for Sans-Serif option -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
    />

    <!-- Jost font for default text -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap"
    />

    <!-- Initialize theme before page renders to prevent flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("weestoater:theme");
          if (
            !theme &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
          if (theme) {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Initialize user settings -->
    <script>
      (function () {
        try {
          var settings = localStorage.getItem("weestoater:settings");
          if (settings) {
            settings = JSON.parse(settings);
            var root = document.documentElement;

            // Font map
            var fontMap = {
              default: "'Jost', sans-serif",
              serif: "Georgia, 'Times New Roman', serif",
              "sans-serif": "'Ubuntu', sans-serif",
              dyslexic: "OpenDyslexic, 'Comic Sans MS', sans-serif",
            };

            // Font size map (rem-based)
            var fontSizeMap = {
              smaller: "0.8rem",
              medium: "1rem",
              large: "1.2rem",
              huge: "1.5rem",
            };

            if (settings.font) {
              root.style.setProperty("--user-font", fontMap[settings.font]);
            }
            if (settings.fontSize) {
              root.style.setProperty(
                "--user-font-size",
                fontSizeMap[settings.fontSize]
              );
            }

            // Apply high contrast mode if enabled
            if (settings.highContrast) {
              root.setAttribute("data-high-contrast", "true");
            }
          }
        } catch (e) {}
      })();
    </script>

    <title>weestoater</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
