    <!-- Initialize theme before page renders to prevent flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("weestoater:theme");
          if (
            !theme &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
          if (theme) {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Initialize user settings -->
    <script>
      (function () {
        try {
          var settings = localStorage.getItem("weestoater:settings");
          if (settings) {
            settings = JSON.parse(settings);
            var root = document.documentElement;

            // Font map
            var fontMap = {
              default: "'Jost', sans-serif",
              serif: "Georgia, 'Times New Roman', serif",
              "sans-serif": "'Ubuntu', sans-serif",
              dyslexic: "OpenDyslexic, 'Comic Sans MS', sans-serif",
            };

            // Font size map (rem-based)
            var fontSizeMap = {
              smaller: "0.8rem",
              medium: "1rem",
              large: "1.2rem",
              huge: "1.5rem",
            };

            if (settings.font) {
              root.style.setProperty("--user-font", fontMap[settings.font]);
            }
            if (settings.fontSize) {
              root.style.setProperty(
                "--user-font-size",
                fontSizeMap[settings.fontSize]
              );
            }

            // Apply high contrast mode if enabled
            if (settings.highContrast) {
              root.setAttribute("data-high-contrast", "true");
            }
          }
        } catch (e) {}
      })();
    </script>
