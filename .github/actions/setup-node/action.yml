name: "Setup Node.js with Yarn Cache"
description: "Setup Node.js with standardized version and Yarn cache"
inputs:
  node-version:
    description: "Node.js version to use (optional, defaults to project standard)"
    required: false
    default: "20.x"
runs:
  using: "composite"
  steps:
    - name: Read Node.js version from .nvmrc
      id: nvmrc
      shell: bash
      run: |
        if [ -f .nvmrc ]; then
          echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
          echo "Using Node.js version from .nvmrc: $(cat .nvmrc)"
        else
          echo "NODE_VERSION=${{ inputs.node-version }}" >> $GITHUB_OUTPUT
          echo "Using default Node.js version: ${{ inputs.node-version }}"
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
        cache: "yarn"

    - name: Display Node.js and Yarn versions
      shell: bash
      run: |
        echo "Node.js version: $(node --version)"
        echo "Yarn version: $(yarn --version)"
