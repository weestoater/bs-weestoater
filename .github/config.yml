# GitHub Actions Configuration
# This file centralizes configuration values used across all workflows

# Node.js versions
NODE_VERSION_PRIMARY: "20.x"
NODE_VERSION_SECONDARY: "18.x"
NODE_VERSION_LTS: "20.x"

# Other configuration
YARN_CACHE_FOLDER: ".yarn/cache"
BUILD_OUTPUT_DIR: "dist"
COVERAGE_OUTPUT_DIR: "coverage"

# Timeouts (in minutes)
BUILD_TIMEOUT: 10
TEST_TIMEOUT: 15
E2E_TIMEOUT: 20
