name: Playwright PR

on:
  pull_request:

concurrency:
  group: playwright-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser deps
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright CLI
        run: npx playwright --version
name: Playwright PR Check

on:
  pull_request:
    branches: [main]

jobs:
  playwright-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Verify Playwright
        run: npx playwright --versionname: Playwright PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            command: yarn test:e2e:smoke
          - suite: a11y
            command: yarn test:e2e:a11y
          - suite: component
            command: yarn test:e2e:component
          - suite: visual
            command: yarn test:e2e:visual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright suite
        run: ${{ matrix.command }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
