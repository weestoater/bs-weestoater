name: CI Ultra Simple

on:
  push:
    branches: [main, github-actions]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          echo "Node version check:"
          node --version || echo "Node not found"
          echo "Yarn version check:"
          yarn --version || echo "Yarn not found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Verify setup
        run: |
          echo "After Node setup:"
          node --version
          yarn --version

      - name: Check package.json
        run: |
          echo "Package.json exists:"
          ls -la package.json
          echo "Yarn.lock exists:"
          ls -la yarn.lock

      - name: Install dependencies (verbose)
        run: |
          echo "Starting yarn install..."
          yarn install --frozen-lockfile --verbose
          echo "Dependencies installed successfully"

      - name: List node_modules
        run: |
          echo "Node modules size:"
          du -sh node_modules/ 2>/dev/null || echo "node_modules not found"

      - name: Try build
        run: |
          echo "Starting build..."
          yarn build
          echo "Build completed successfully"
