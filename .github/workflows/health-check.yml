name: Health Check

on:
  workflow_dispatch:
  schedule:
    # Run every day at 6 AM UTC to check if the site is accessible
    - cron: "0 6 * * *"

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Site Health Check

    steps:
      - name: Check if site is accessible
        run: |
          if curl -f -s https://weestoater.github.io/bs-weestoater/ > /dev/null; then
            echo "✅ Site is accessible"
          else
            echo "❌ Site is not accessible"
            exit 1
          fi

      - name: Check site performance
        run: |
          response_time=$(curl -o /dev/null -s -w '%{time_total}' https://weestoater.github.io/bs-weestoater/)
          echo "Response time: ${response_time}s"
          # Simple comparison without bc dependency
          if (( $(echo "$response_time" | cut -d. -f1) >= 5 )); then
            echo "⚠️  Site is responding slowly (>${response_time}s)"
          else
            echo "✅ Site response time is good"
          fi
